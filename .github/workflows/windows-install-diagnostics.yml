name: Windows installation diagnostics

# A branch-only experiment: pushing it must not start the regular CI or CD.
on:
  push:
    branches: [codex/diagnose-windows-upgrade-download]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        allocation: [baseline, new-image-1, new-image-2]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record runner image and Windows build
        id: image
        shell: pwsh
        run: |
          "ImageOS=$env:ImageOS"
          "ImageVersion=$env:ImageVersion"
          "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' |
            Select-Object ProductName, DisplayVersion, CurrentBuild, UBR |
            Format-List
          Get-Command powershell, pwsh | Select-Object Name, Source | Format-List
          # Match the execution policy set by the normal Windows setup step.
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser

      - name: Compare PowerShell hosts and module environments on the same runner
        # Always collect one baseline for the new environment comparison. The
        # other allocations only install when they obtain the failing image.
        if: matrix.allocation == 'baseline' || steps.image.outputs.version == '20261116.315.1'
        shell: pwsh
        run: |
          $probeScript = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/diagnose-windows-install.ps1'
          $probeRoot = Join-Path $env:RUNNER_TEMP 'moon-windows-install-diagnostics'
          $originalUserPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
          $results = @()
          $variants = @(
            @{ Name = 'powershell-inherited'; Program = 'powershell'; ClearModulePath = $false },
            @{ Name = 'powershell-default-modules'; Program = 'powershell'; ClearModulePath = $true },
            @{ Name = 'pwsh-inherited'; Program = 'pwsh'; ClearModulePath = $false }
          )
          try {
            foreach ($variant in $variants) {
              foreach ($channel in @('latest', 'nightly')) {
                $caseName = "$($variant.Name)-$channel"
                Write-Output "::group::$caseName"
                $destination = Join-Path $probeRoot "case-$($results.Count)"
                New-Item -ItemType Directory -Path $destination -Force | Out-Null
                $start = [System.Diagnostics.ProcessStartInfo]::new()
                $start.FileName = (Get-Command $variant.Program).Source
                $start.ArgumentList.Add($probeScript)
                $start.UseShellExecute = $false
                # Match Command::output(): capture both streams and close stdin.
                $start.RedirectStandardInput = $true
                $start.RedirectStandardOutput = $true
                $start.RedirectStandardError = $true
                $start.Environment['MOON_HOME'] = $destination
                $start.Environment['MOON_TOOLCHAIN_ROOT'] = $destination
                $start.Environment.Remove('MOONBIT_INSTALL_DEV') | Out-Null
                $start.Environment.Remove('MOONBIT_INSTALL_VERSION') | Out-Null
                # Change only the child's inherited module search path. Keep
                # the executable, profile behavior, and installer unchanged.
                if ($variant.ClearModulePath) {
                  $start.Environment.Remove('PSModulePath') | Out-Null
                }
                if ($channel -eq 'nightly') {
                  $start.Environment['MOONBIT_INSTALL_VERSION'] = 'nightly'
                }
                $process = [System.Diagnostics.Process]::new()
                $process.StartInfo = $start
                $result = [pscustomobject]@{
                  Case = $caseName
                  ExitCode = -1
                  TimedOut = $false
                  MoonExists = $false
                  MooncExists = $false
                  HarnessError = $false
                }
                try {
                  $process.Start() | Out-Null
                  $process.StandardInput.Close()
                  $stdout = $process.StandardOutput.ReadToEndAsync()
                  $stderr = $process.StandardError.ReadToEndAsync()
                  $result.TimedOut = -not $process.WaitForExit(480000)
                  if ($result.TimedOut) {
                    $process.Kill($true)
                    $process.WaitForExit()
                  }
                  $result.ExitCode = $process.ExitCode
                  Write-Output '--- stdout ---'
                  Write-Output $stdout.GetAwaiter().GetResult()
                  Write-Output '--- stderr ---'
                  Write-Output $stderr.GetAwaiter().GetResult()
                  $result.MoonExists = [IO.File]::Exists((Join-Path $destination 'bin/moon.exe'))
                  $result.MooncExists = [IO.File]::Exists((Join-Path $destination 'bin/moonc.exe'))
                  $result | Format-List
                } catch {
                  $harnessError = $_
                  $result.HarnessError = $true
                  [Console]::Error.WriteLine('[install-probe] HARNESS ERROR (child status retained)')
                  [Console]::Error.WriteLine($harnessError.Exception.ToString())
                } finally {
                  $results += $result
                  # Cleanup diagnostics must never replace the install failure.
                  try {
                    $process.Dispose()
                    [Environment]::SetEnvironmentVariable('PATH', $originalUserPath, 'User')
                    Remove-Item -LiteralPath $destination -Recurse -Force -ErrorAction Continue
                    $archive = Join-Path $env:USERPROFILE 'moonbit.zip'
                    if (Test-Path -LiteralPath $archive) {
                      Remove-Item -LiteralPath $archive -Force -ErrorAction Continue
                    }
                  } catch {
                    [Console]::Error.WriteLine("[install-probe] ADDITIONAL CLEANUP ERROR: $($_.Exception)")
                  }
                  Write-Output '::endgroup::'
                }
              }
            }
          } finally {
            if (Test-Path -LiteralPath $probeRoot) {
              Remove-Item -LiteralPath $probeRoot -Recurse -Force -ErrorAction Continue
            }
            $results | Format-Table -AutoSize
          }
          if ($results | Where-Object { $_.ExitCode -ne 0 -or $_.TimedOut -or $_.HarnessError -or -not $_.MoonExists -or -not $_.MooncExists }) {
            throw 'One or more installation probes failed; see the original errors and child output above.'
          }
