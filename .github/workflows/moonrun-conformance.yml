name: Moonrun async conformance

on:
  push:
    branches:
      - main
    paths:
      - 'crates/moonrun/**'
      - 'third_party/moonbitlang_async'
      - '.github/workflows/moonrun-conformance.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'crates/moonrun/**'
      - 'third_party/moonbitlang_async'
      - '.github/workflows/moonrun-conformance.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install MoonBit (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/target/debug" >> $GITHUB_PATH

      - name: Install MoonBit (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $env:MOONBIT_INSTALL_VERSION="nightly"
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$env:GITHUB_WORKSPACE\target\debug" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Moon and Moonrun
        run: cargo build -p moon -p moonrun

      - name: Bundle core (Unix)
        if: matrix.os != 'windows-latest'
        run: cargo run --bin moon -- -C ~/.moon/lib/core bundle --all

      - name: Bundle core (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo run --bin moon -- -C "$env:USERPROFILE\.moon\lib\core" bundle --all

      - name: Test Moonrun against upstream async
        run: cargo test -p moonrun --test test test_moonrun_against_upstream_async -- --ignored --exact
