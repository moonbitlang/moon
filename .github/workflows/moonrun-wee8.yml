name: Moonrun wee8

on:
  push:
    branches: [main]
    paths: ['crates/moonrun/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/moonrun-wee8.yml']
  pull_request:
    branches: [main]
    paths: ['crates/moonrun/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/moonrun-wee8.yml']

permissions:
  contents: read

concurrency:
  group: wee8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: wee8 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Git
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep this feature's cache separate; native archives are staged by build.rs.
          shared-key: moonrun-wee8
          cache-targets: false
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_VERSION="nightly"
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Check wee8 adapter
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p moonrun --no-default-features --features wee8 --lib --bins --test wee8 --test wasi_imports -- -D warnings
      - name: Test shared host definitions and Moonrun integration
        run: |
          cargo test --locked -p moonrun --no-default-features --features wee8 --lib
          cargo test --locked -p moonrun --no-default-features --features wee8 --test wee8 --test wasi_imports
      - name: Check compatible engine features
        run: cargo test --locked -p moonrun --no-default-features --features wee8,wasmtime --test wee8 modules_without_start_export_complete
