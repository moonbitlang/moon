name: Diagnose xctrace without Moon

on:
  push:
    branches: [codex/diagnose-profile-timeout]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - name: Record runner versions
        run: |
          sw_vers
          xcodebuild -version
      - name: Repeat standalone xctrace
        run: python3 .github/scripts/diagnose-xctrace-record.py
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xctrace-diagnostics-${{ matrix.attempt }}
          path: ${{ runner.temp }}/xctrace-diagnostics
          retention-days: 3
          if-no-files-found: warn
