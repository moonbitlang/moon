name: CD

on:
  workflow_dispatch:
    inputs:
      glibc-version:
        description: Minimum glibc version for Linux x86_64 binaries
        required: true
        default: "2.23"
        type: string
  push:
    branches:
      - main

jobs:
  core-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install MoonBit (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_VERSION="nightly"
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$env:GITHUB_WORKSPACE\target\debug" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        run: cargo build

      - name: Versions
        run: cargo run --bin moon -- version --all

      - name: Bundle core (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: cargo run --bin moon -- -C ~/.moon/lib/core bundle --all

      - name: Bundle core (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: cargo run --bin moon -- -C "$env:USERPROFILE\.moon\lib\core" bundle --all

      - name: Test core (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        env:
          MOONRUN_OVERRIDE: ${{ github.workspace }}/target/debug/moonrun
        run: |
          cargo run --bin moon -- -C ~/.moon/lib/core test -j 8 --target all
          cargo run --bin moon -- -C ~/.moon/lib/core test -j 8 --release --target all

      - name: Test core (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          MOONRUN_OVERRIDE: ${{ github.workspace }}\target\debug\moonrun.exe
        run: |
          cargo run --bin moon -- -C "$env:USERPROFILE\.moon\lib\core" test --target all
          cargo run --bin moon -- -C "$env:USERPROFILE\.moon\lib\core" test --release --target all

      # LLVM is currently disabled because it doesn't exist on non-bleeding channels.
      # TODO: Add this back when we add LLVM to nightly.

  build:
    needs: core-test
    strategy:
      matrix:
        os: [macos-latest, ubuntu-22.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Upload(Unix)
        if: ${{ runner.os != 'Windows' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          version=$(echo "$GITHUB_SHA" | cut -c 1-9)
          aws s3 cp target/release/moon "s3://${{ secrets.AWS_BUCKET_NAME }}/bleeding-moon/$version/$(uname -s)-$(uname -m)/"
          aws s3 cp target/release/moonrun "s3://${{ secrets.AWS_BUCKET_NAME }}/bleeding-moonrun/$version/$(uname -s)-$(uname -m)/"

      - name: Upload(Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          $version = "$env:GITHUB_SHA".Substring(0, 9)
          aws s3 cp .\target\release\moon.exe "s3://${{ secrets.AWS_BUCKET_NAME }}/bleeding-moon/$version/Windows-x86_64/"
          aws s3 cp .\target\release\moonrun.exe "s3://${{ secrets.AWS_BUCKET_NAME }}/bleeding-moonrun/$version/Windows-x86_64/"

  ubuntu-build:
    needs: core-test
    runs-on: ubuntu-latest
    env:
      LINUX_GLIBC_VERSION: ${{ inputs.glibc-version || '2.23' }}
      LINUX_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
          targets: ${{ env.LINUX_TARGET }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        run: cargo install --locked --version 0.22.1 cargo-zigbuild

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo zigbuild --release --target "${LINUX_TARGET}.${LINUX_GLIBC_VERSION}"

      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          version=$(echo "$GITHUB_SHA" | cut -c 1-9)
          aws s3 cp "target/$LINUX_TARGET/release/moon" "s3://${{ secrets.AWS_BUCKET_NAME }}/bleeding-moon/$version/$(uname -s)-$(uname -m)/"
          aws s3 cp "target/$LINUX_TARGET/release/moonrun" "s3://${{ secrets.AWS_BUCKET_NAME }}/bleeding-moonrun/$version/$(uname -s)-$(uname -m)/"
