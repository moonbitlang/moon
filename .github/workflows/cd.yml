name: CD

on:
  workflow_dispatch:
    inputs:
      glibc-version:
        description: Minimum glibc version for Linux x86_64 binaries
        required: true
        default: "2.23"
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  BUILD_ARTIFACTS_BUCKET: ${{ secrets.MOONBIT_BUILD_ARTIFACTS_BUCKET }}

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-22.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - name: Remove unused Rust toolchains
        shell: bash
        run: bash .github/scripts/prune-rust-toolchains.sh

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.MOONBIT_CD_AWS_ROLE_ARN }}
          aws-region: us-west-2
          allowed-account-ids: ${{ secrets.MOONBIT_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Upload(Unix)
        if: ${{ runner.os != 'Windows' }}
        run: |
          version=$(echo "$GITHUB_SHA" | cut -c 1-9)
          aws s3 cp target/release/moon "s3://${{ env.BUILD_ARTIFACTS_BUCKET }}/bleeding-moon/$version/$(uname -s)-$(uname -m)/"
          aws s3 cp target/release/moonrun "s3://${{ env.BUILD_ARTIFACTS_BUCKET }}/bleeding-moonrun/$version/$(uname -s)-$(uname -m)/"

      - name: Upload(Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $version = "$env:GITHUB_SHA".Substring(0, 9)
          aws s3 cp .\target\release\moon.exe "s3://${{ env.BUILD_ARTIFACTS_BUCKET }}/bleeding-moon/$version/Windows-x86_64/"
          aws s3 cp .\target\release\moonrun.exe "s3://${{ env.BUILD_ARTIFACTS_BUCKET }}/bleeding-moonrun/$version/Windows-x86_64/"

  ubuntu-build:
    runs-on: ubuntu-latest
    env:
      LINUX_GLIBC_VERSION: ${{ inputs.glibc-version || '2.23' }}
      LINUX_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
          targets: ${{ env.LINUX_TARGET }}

      - name: Remove unused Rust toolchains
        shell: bash
        run: bash .github/scripts/prune-rust-toolchains.sh

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        run: cargo install --locked --version 0.22.1 cargo-zigbuild

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo zigbuild --release --target "${LINUX_TARGET}.${LINUX_GLIBC_VERSION}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.MOONBIT_CD_AWS_ROLE_ARN }}
          aws-region: us-west-2
          allowed-account-ids: ${{ secrets.MOONBIT_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Upload
        run: |
          version=$(echo "$GITHUB_SHA" | cut -c 1-9)
          aws s3 cp "target/$LINUX_TARGET/release/moon" "s3://${{ env.BUILD_ARTIFACTS_BUCKET }}/bleeding-moon/$version/$(uname -s)-$(uname -m)/"
          aws s3 cp "target/$LINUX_TARGET/release/moonrun" "s3://${{ env.BUILD_ARTIFACTS_BUCKET }}/bleeding-moonrun/$version/$(uname -s)-$(uname -m)/"
