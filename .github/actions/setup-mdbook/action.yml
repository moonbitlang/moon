name: Set up mdBook
description: Download the latest mdBook release with GitHub authentication.
runs:
  using: composite
  steps:
    - name: Download and install mdBook
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        directory="$RUNNER_TEMP/mdbook"
        bash "$GITHUB_ACTION_PATH/../../scripts/download-release.sh" \
          --repo rust-lang/mdBook \
          --pattern 'mdbook-*-x86_64-unknown-linux-gnu.tar.gz' \
          --dir "$directory"
        tar -xzf "$directory"/mdbook-*.tar.gz -C "$directory"
        echo "$directory" >> "$GITHUB_PATH"
