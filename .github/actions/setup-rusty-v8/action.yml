name: Set up rusty_v8 archive
description: Cache the locked rusty_v8 release and provide its local archive to Cargo.
inputs:
  target:
    description: Rust target triple; defaults to the active compiler's host.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Resolve rusty_v8 archive
      id: archive
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        version=$(awk '
          $0 == "name = \"v8\"" { found = 1; next }
          found && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
        ' Cargo.lock)
        : "${version:?No v8 package in Cargo.lock}"
        target="${TARGET:-$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')}"
        # rusty_v8 uses release archives for both Cargo debug and release builds.
        case "$target" in
          *-windows-msvc) asset="rusty_v8_release_${target}.lib.gz" ;;
          *) asset="librusty_v8_release_${target}.a.gz" ;;
        esac
        {
          echo "version=$version"
          echo "target=$target"
          echo "asset=$asset"
        } >> "$GITHUB_OUTPUT"

    - name: Restore rusty_v8 archive
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/rusty-v8
        key: rusty-v8-v1-${{ steps.archive.outputs.version }}-${{ steps.archive.outputs.target }}

    - name: Download rusty_v8 archive
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.archive.outputs.version }}
        ASSET: ${{ steps.archive.outputs.asset }}
      run: |
        gh release download "v$VERSION" \
          --repo denoland/rusty_v8 --pattern "$ASSET" --dir "$RUNNER_TEMP/rusty-v8"

    - name: Use local rusty_v8 archive
      shell: bash
      env:
        ASSET: ${{ steps.archive.outputs.asset }}
      run: |
        gzip -t "$RUNNER_TEMP/rusty-v8/$ASSET"
        echo "RUSTY_V8_ARCHIVE=$RUNNER_TEMP/rusty-v8/$ASSET" >> "$GITHUB_ENV"

    - name: Save rusty_v8 archive
      if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/rusty-v8
        key: ${{ steps.cache.outputs.cache-primary-key }}
