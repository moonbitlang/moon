name: Set up shared debug cache
description: Set up Rust and reuse the dependency cache populated by main nightly tests.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy

    - name: Remove unused Rust toolchains
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../../scripts/prune-rust-toolchains.sh"

    - name: Cargo cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: moon-debug-v1
        # Consumers stay parallel and read the last successful main cache.
        save-if: ${{ github.ref == 'refs/heads/main' && github.job == 'nightly-test' }}
