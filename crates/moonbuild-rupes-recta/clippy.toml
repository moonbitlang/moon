# Banning direct I/O functions. Rupes Recta should not perform any file I/O
# operations directly except when strictly necessary (e.g. reading config
# files).
disallowed-methods = [
    "std::fs::remove_file",
    "std::fs::read",
    "std::fs::read_to_string",
    "std::fs::write",
    "std::fs::copy",
    "std::fs::rename",
    "std::fs::metadata",
    "std::fs::set_permissions",
    "std::fs::read_dir",
    "std::fs::create_dir",
    "std::fs::create_dir_all",
    "std::fs::remove_dir",
    "std::fs::remove_dir_all",
    "std::fs::File::open",
    "std::fs::File::create",
    # Moonutil functions that perform file I/O
    "moonutil::manifest::read_module_from_json",
    "moonutil::manifest::write_module_json_to_file",
    "moonutil::manifest::write_package_json_to_file",
    "moonutil::manifest::read_module_desc_file_in_dir",
    "moonutil::manifest::read_package_desc_file_in_dir",
]
disallowed-types = [
    "std::fs::File",
    "std::io::Stdin",
    "std::io::Stdout",
    "std::io::Stderr",
]
