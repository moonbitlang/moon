[package]
name = "moon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
exclude = [".github/*", ".vscode/*"]
readme = "README.md"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anstream.workspace = true
anstyle.workspace = true
moonbuild.workspace = true
mooncake.workspace = true
moonutil.workspace = true
moonbuild-rupes-recta.workspace = true

semver.workspace = true
clap.workspace = true
anyhow.workspace = true
colored.workspace = true
serde.workspace = true
serde_json_lenient.workspace = true
serde_json.workspace = true
dunce.workspace = true
ctrlc.workspace = true
home.workspace = true
which.workspace = true
chrono.workspace = true
log.workspace = true
walkdir.workspace = true
notify.workspace = true
tokio = { workspace = true, features = ["rt", "signal"] }
tokio-util.workspace = true
clap_complete.workspace = true
indexmap.workspace = true
petgraph.workspace = true
rand.workspace = true
tempfile.workspace = true
shlex.workspace = true
derive_builder.workspace = true
sha2.workspace = true
blake3.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
flate2.workspace = true
tar.workspace = true
url.workspace = true

ignore.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
tracing-chrome.workspace = true

[target."cfg(target_os = \"macos\")".dependencies]
libc.workspace = true

[target."cfg(windows)".dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]

[dev-dependencies]
regex.workspace = true
snapbox = { workspace = true, features = ["regex"] }
expect-test.workspace = true
escargot.workspace = true
clap-markdown.workspace = true
similar.workspace = true
libc.workspace = true
moon-test-util.workspace = true
zip.workspace = true


[[bin]]
name = "moon"
bench = false
